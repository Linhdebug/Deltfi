<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Battle</title>

<style>
    body {
        margin: 0;
        background: black;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        overflow: hidden;
    }

    /* Caja de batalla */
    #battle-box {
        position: relative;
        width: 80vw;
        max-width: 600px;
        height: 60vw;
        max-height: 400px;
        border: 6px solid white;
        background: black;
        box-sizing: border-box;
    }

    /* Alma */
    #soul {
        position: absolute;
        width: 48px;
        height: 48px;
        background-image: url("alma.png");
        background-size: contain;
        background-repeat: no-repeat;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
    }

    /* Mobile buttons */
    #controls {
        position: absolute;
        bottom: -140px;
        display: flex;
        gap: 20px;
    }

    .btn {
        width: 70px;
        height: 70px;
        background: white;
        color: black;
        font-size: 28px;
        font-family: monospace;
        display: flex;
        align-items: center;
        justify-content: center;
        user-select: none;
    }

    @media (min-width: 900px) {
        #controls {
            display: none;
        }
    }
</style>
</head>
<body>

<div id="battle-box">
    <div id="soul"></div>
</div>

<div id="controls">
    <div class="btn" data-dir="left">←</div>
    <div class="btn" data-dir="up">↑</div>
    <div class="btn" data-dir="down">↓</div>
    <div class="btn" data-dir="right">→</div>
</div>

<script>
    const soul = document.getElementById("soul");
    const box = document.getElementById("battle-box");

    let x = box.clientWidth / 2 - 24;
    let y = box.clientHeight / 2 - 24;
    const speed = 5;

    function updatePosition() {
        const maxX = box.clientWidth - soul.clientWidth;
        const maxY = box.clientHeight - soul.clientHeight;

        x = Math.max(0, Math.min(x, maxX));
        y = Math.max(0, Math.min(y, maxY));

        soul.style.left = x + "px";
        soul.style.top = y + "px";
    }

    document.addEventListener("keydown", e => {
        if (e.key === "ArrowLeft") x -= speed;
        if (e.key === "ArrowRight") x += speed;
        if (e.key === "ArrowUp") y -= speed;
        if (e.key === "ArrowDown") y += speed;
        updatePosition();
    });

    document.querySelectorAll(".btn").forEach(btn => {
        btn.addEventListener("touchstart", () => {
            const dir = btn.dataset.dir;
            if (dir === "left") x -= speed * 2;
            if (dir === "right") x += speed * 2;
            if (dir === "up") y -= speed * 2;
            if (dir === "down") y += speed * 2;
            updatePosition();
        });
    });

    updatePosition();
</script>

</body>
</html>
